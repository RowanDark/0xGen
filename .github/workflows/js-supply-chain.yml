name: 0xgen JS Supply Chain

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Guard against duplicate JS lockfiles
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          fail=0
          for manifest in **/package.json; do
            [[ "$manifest" == */node_modules/* ]] && continue
            dir=$(dirname "$manifest")
            locks=()
            for lock in package-lock.json pnpm-lock.yaml yarn.lock; do
              [ -f "$dir/$lock" ] && locks+=("$lock")
            done
            if [ "${#locks[@]}" -gt 1 ]; then
              echo "Multiple lockfiles in $dir: ${locks[*]} — pick one package manager and delete the rest" >&2
              fail=1
            fi
          done
          exit "$fail"

      - name: Audit plugin dependencies
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for manifest in plugins/*/package.json; do
            dir=$(dirname "$manifest")
            if [ ! -f "$dir/package-lock.json" ]; then
              echo "Missing package-lock.json for $dir" >&2
              exit 1
            fi
            echo "\n>>> auditing ${dir##*/}"
            npm ci --omit=dev --prefix "$dir"
            npm audit --omit=dev --audit-level=high --prefix "$dir"
            found=1
          done
          if [ "$found" -eq 0 ]; then
            echo "No Node.js plugins found"
          fi
